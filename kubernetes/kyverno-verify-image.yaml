# Blocks any notes-app pod whose image is not signed by the key in cosign.pub.
#
# Argo CD cannot do this -- it has no image-signature verification. Enforcement
# happens at admission: Argo CD applies the Deployment, the API server calls
# Kyverno, and Kyverno rejects the pod if the signature does not check out.
#
# (Argo CD's own spec.signatureKeys on an AppProject verifies GPG signatures on
# git COMMITS -- a different thing entirely from cosign signatures on IMAGES.)
#
# Install Kyverno first:
#
#   helm repo add kyverno https://kyverno.github.io/kyverno
#   helm install kyverno kyverno/kyverno -n kyverno --create-namespace
#   kubectl apply -f kubernetes/kyverno-verify-image.yaml
#
# Kyverno needs egress to docker.io: signatures are stored in the registry
# beside the image, so it must fetch them to verify.
#
# The public key below is safe in git -- only cosign.key must stay secret.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-notes-app
spec:
  # Audit = log failures only. Start here, confirm it passes, THEN switch to
  # Enforce -- under Enforce a mismatch means pods are refused outright and the
  # app stops deploying.
  validationFailureAction: Audit
  background: false
  rules:
    - name: check-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
      verifyImages:
        - imageReferences:
            - "docker.io/jahadulrakib/notes-app:*"
          # Must match how Jenkins signs. The pipeline passes
          # --tlog-upload=false because rekor.sigstore.dev is unreachable from a
          # private network, so there is no transparency-log entry to check.
          # Omit this and every verification fails.
          ctlog:
            ignoreTlog: true
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE9pzDmp26walej+dJG0KmqP82X8EK
                      MbGDNyWjJNZhmYd2RUeNZeOYVHyYYcqCBkhNAu6TElNyVW+fC/RX8ON0hA==
                      -----END PUBLIC KEY-----
