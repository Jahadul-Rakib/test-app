# Keeps the `default` namespace matching helm/ on main.
# Setup and prerequisites: abc_local_setup/local-kind-setup.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Jahadul-Rakib/test-app.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Argo Rollouts rewrites Service selectors during a canary to steer traffic.
  # selfHeal would revert that mid-rollout and stall the canary.
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this, ignoreDifferences only hides the drift; sync still
      # clobbers the selector.
      - RespectIgnoreDifferences=true
    # Retries of a FAILED sync -- not the git poll interval, which is
    # cluster-wide in argocd-cm.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
