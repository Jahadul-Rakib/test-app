# Jenkins Helm values -- path-based routing behind MetalLB + ingress-nginx.
#
# Reached at http://<METALLB-IP>/jenkins  (no DNS, no /etc/hosts entry).
# Discover the IP with:
#   kubectl -n ingress-nginx get svc ingress-nginx-controller \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# `controller.jenkinsUrl` is deliberately NOT set here -- it needs the live IP,
# so the install command passes it with --set. See local-kind-setup.md step 7.

controller:
  image:
    registry: docker.io
    repository: jahadulrakib/jenkins-devops-kubernetes
    tag: lts-jdk21
    pullPolicy: IfNotPresent

  numExecutors: 2

  # Root, so the container can use the mounted docker socket without fighting
  # group ownership. BOTH levels are required: the chart's
  # containerSecurityContext.runAsUser overrides the pod-level one.
  runAsUser: 0
  fsGroup: 0
  containerSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

  # --- Path-based routing ---------------------------------------------------
  # THE load-bearing setting. It appends --prefix=/jenkins to the Jenkins JVM,
  # so Jenkins itself serves under /jenkins and generates every internal link,
  # redirect and static-asset URL with that prefix already on it.
  #
  # This is why there is NO rewrite-target annotation below: the backend
  # genuinely expects /jenkins/... A rewrite that stripped the prefix would give
  # a Jenkins that renders once and then 404s every CSS, JS and form POST,
  # because the HTML would still point at /jenkins/* while Jenkins listened on
  # /*.
  #
  # It also fixes the probes for free -- the chart templates them as
  # `{{ default "" .Values.controller.jenkinsUriPrefix }}/login`, so they follow
  # to /jenkins/login instead of 404ing and crash-looping the pod.
  jenkinsUriPrefix: /jenkins

  ingress:
    enabled: true
    ingressClassName: nginx
    path: /jenkins
    # Prefix, not ImplementationSpecific (the chart default): /jenkins must also
    # match /jenkins/, /jenkins/login, /jenkins/static/... Everything Jenkins
    # serves lives under that subtree.
    pathType: Prefix
    # hostName intentionally omitted. With no host, the rule matches ANY Host
    # header, which is what makes http://<IP>/jenkins work with no DNS.
    annotations:
      # Jenkins file uploads (plugin .hpi, job config) exceed nginx's 1m
      # default and fail with 413.
      nginx.ingress.kubernetes.io/proxy-body-size: 50m
      # Long-poll and CLI-over-HTTP connections idle well past the 60s default.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

  # `installPlugins` is left unset ON PURPOSE. Setting it REPLACES the chart's
  # four pinned defaults rather than adding to them; additionalPlugins layers on
  # top and keeps the pins.
  additionalPlugins:
    - timestamper:latest           # REQUIRED -- backs options { timestamps() }
    - credentials-binding:latest   # withCredentials() in Push/Sign/GitOps
    - docker-workflow:latest
    - pipeline-utility-steps:latest
    - ws-cleanup:latest
    - github:latest
    - antisamy-markup-formatter:latest
    - build-timeout:latest

# No dynamic Kubernetes agents -- the tooling lives in the controller image, and
# `agent any` would otherwise schedule onto a bare inbound-agent with no docker.
agent:
  enabled: false

persistence:
  storageClass: standard
  size: 8Gi
  # Host docker socket, passed through by the kind extraMount.
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
  mounts:
    - name: docker-sock
      mountPath: /var/run/docker.sock
