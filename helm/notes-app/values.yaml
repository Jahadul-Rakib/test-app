replicaCount: 1

# image.repository / image.tag are rewritten by the Jenkins "Update GitOps
# manifest" stage. Do not hand-edit; Argo CD syncs whatever lands here.
image: docker.io/jahadulrakib/notes-app:latest
imagePullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: notes.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
