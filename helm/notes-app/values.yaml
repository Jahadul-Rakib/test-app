# At least 4 so the canary setWeight steps are meaningful. Without a traffic
# router, weight is approximated by replica count -- at 1 replica the canary is
# one whole pod, i.e. 100% of traffic.
replicaCount: 4

# Rewritten by the Jenkins 'Update GitOps' stage on every build. Do not
# hand-edit; Argo CD syncs whatever lands here.
image: docker.io/jahadulrakib/notes-app:latest
imagePullPolicy: IfNotPresent

# Reference only -- the chart never creates this Secret. Apply it first with
# kubernetes/dockerhub-pull-secret.sh, which keeps the token out of git.
# Must already exist in the release namespace. See docs/credentials.md.
imagePullSecrets:
  - name: dockerhub-pull

# Canary deployment via Argo Rollouts. The workload is a Rollout, not a
# Deployment -- the Argo Rollouts controller and CRDs must be installed or Argo
# CD fails to sync with `no matches for kind "Rollout"`.
rollout:
  revisionHistoryLimit: 3
  maxSurge: 1
  maxUnavailable: 0

  # nginx-based traffic splitting. Off by default because it requires
  # ingress.enabled -- Rollouts steers traffic by rewriting the stable Ingress,
  # and has nothing to work with otherwise.
  #
  # OFF: setWeight is approximated by replica count, so it rounds to whole
  #      pods. At replicaCount 4 the steps below land on 1, 2 and 3 pods.
  #      Drop replicaCount and the steps stop meaning anything.
  # ON:  setWeight is a real percentage of requests, independent of replicas.
  trafficRouting:
    enabled: false

  canary:
    steps:
      - setWeight: 25
      - pause: {duration: 60s}
      - setWeight: 50
      - pause: {duration: 60s}
      - setWeight: 75
      - pause: {duration: 60s}
    # No trailing setWeight: 100 -- the final promotion to full traffic is
    # implicit once the last step completes.
    #
    # Use `- pause: {}` with no duration to hold indefinitely until someone
    # runs `kubectl argo rollouts promote notes-app`, for a manual gate.

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: notes.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
