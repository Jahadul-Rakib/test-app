# Without a traffic router, canary weight is approximated by replica count.
# At 4, the steps below land on 1, 2 and 3 pods; at 1 the canary is everything.
replicaCount: 2

# Rewritten by the Jenkins 'Update GitOps' stage. Do not hand-edit.
image: docker.io/jahadulrakib/notes-app:6faddc9fad1504e4a4d0a68951ba36426bc7a770
imagePullPolicy: IfNotPresent

# Referenced only -- created by hand, see abc_local_setup/local-kind-setup.md step 9.2.
imagePullSecrets:
  - name: dockerhub-pull

rollout:
  revisionHistoryLimit: 3
  maxSurge: 1
  maxUnavailable: 0

  # Real percentage-based splitting instead of replica-count approximation.
  # Requires ingress.enabled -- Rollouts steers by rewriting the stable Ingress.
  trafficRouting:
    enabled: false

  canary:
    # No trailing setWeight: 100 -- full promotion is implicit.
    # `- pause: {}` with no duration holds until promoted by hand.
    steps:
      - setWeight: 25
      - pause: {duration: 10s}
      - setWeight: 50
      - pause: {duration: 10s}
      - setWeight: 75
      - pause: {duration: 10s}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx

  # Reached at http://<METALLB-IP>/app -- no DNS, no /etc/hosts.
  #
  # The regex is the rewrite pair: group 2 captures everything after /app, and
  # rewrite-target below replaces the whole match with it. So /app/add reaches
  # the container as /add.
  #
  # ImplementationSpecific, not Prefix: this path is a REGEX, and Prefix is
  # defined as literal element-wise matching. nginx honours the regex either
  # way, but declaring Prefix would be a lie to any other controller.
  path: /app(/|$)(.*)
  pathType: ImplementationSpecific

  # Empty = the rule matches any Host header, which is what makes IP access
  # work. Set this (and simplify `path` to /) to switch to hostname routing.
  host: ""

  annotations:
    # Strip /app before the request reaches gunicorn. The Flask app defines
    # routes at /, /add, /delete/<id> -- it has no /app prefix of its own, so
    # without this every request 404s inside the container.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Non-secret configuration -> ConfigMap(s). See templates/configmap.yaml.
# A change here restarts the pods through the canary, via the checksum
# annotation on the pod template.
config:
  enabled: true

  # Flat keys, injected as environment variables with envFrom. Values are
  # quoted at render time, so `8080` and `true` are safe to write unquoted.
  env:
    APP_TITLE: "Notes"
    APP_ENV: "local"

    # The other half of path-based routing, and the reason no application code
    # or image rebuild was needed for it.
    #
    # The Ingress strips /app, so gunicorn sees PATH_INFO=/ and Flask's routes
    # match. But url_for() would then emit href="/add" -- absolute, prefix-less
    # -- and the browser would request http://<IP>/add, which no Ingress rule
    # claims: 404 on every Add and Delete, from a page that rendered fine.
    #
    # gunicorn copies this variable into the WSGI environ as SCRIPT_NAME, which
    # is exactly what Werkzeug prepends when building URLs. url_for() then emits
    # /app/add and the forms post back through the Ingress.
    #
    # Must match the Ingress path prefix. Change one, change both.
    SCRIPT_NAME: "/app"

  # Whole file bodies, mounted read-only at mountPath, one file per key. Empty
  # by default -- no second ConfigMap and no volume is rendered until you add
  # something here. Bodies are run through `tpl`, so {{ .Release.Name }} and
  # friends work inside them.
  files: {}
  #  banner.txt: |
  #    Deployed by {{ .Release.Name }}
  mountPath: /etc/notes-app

podAnnotations: {}

# --- Scheduling -------------------------------------------------------------
# Generic placement. `gpu` below layers onto these rather than replacing them.
nodeSelector: {}
tolerations: []
affinity: {}

# Set only where the NVIDIA runtime is not containerd's default; the GPU
# Operator installs a RuntimeClass named `nvidia` for that case.
runtimeClassName: ""

# GPU scheduling. Off by default -- this is a Flask app and needs no GPU; the
# block exists so the same chart deploys unchanged onto a GPU node. See
# abc_local_setup/gpu-node-setup.md.
gpu:
  enabled: false

  # `nvidia.com/gpu` is what the NVIDIA device plugin advertises. Whole devices
  # only -- fractions are rejected. To share one physical GPU, turn on
  # time-slicing in the plugin (local-kind-setup.md step 10.6); the resource name
  # stays the same and each replica just becomes a slice.
  resourceName: nvidia.com/gpu
  count: 1

  # Applied by Node Feature Discovery, which ships with the GPU Operator and is
  # optional with the standalone device plugin. Add gpu.product to pin a model
  # in a mixed fleet, e.g. "NVIDIA-A100-SXM4-40GB".
  nodeSelector:
    nvidia.com/gpu.present: "true"

  # Matches the taint that keeps CPU-only workloads off GPU nodes:
  #   kubectl taint nodes <node> nvidia.com/gpu=present:NoSchedule
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
