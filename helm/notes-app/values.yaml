# Without a traffic router, canary weight is approximated by replica count.
# At 4, the steps below land on 1, 2 and 3 pods; at 1 the canary is everything.
replicaCount: 2

# Rewritten by the Jenkins 'Update GitOps' stage. Do not hand-edit.
image: docker.io/jahadulrakib/notes-app:490b7fcd61717752fd413a0676e5e1f27712edc3
imagePullPolicy: IfNotPresent

# Referenced only -- created by hand, see abc_local_setup/local-kind-setup.md step 9.2.
imagePullSecrets:
  - name: dockerhub-pull

rollout:
  revisionHistoryLimit: 3
  maxSurge: 1
  maxUnavailable: 0

  # Real percentage-based splitting instead of replica-count approximation.
  # Requires ingress.enabled -- Rollouts steers by rewriting the stable Ingress.
  trafficRouting:
    enabled: false

  canary:
    # No trailing setWeight: 100 -- full promotion is implicit.
    # `- pause: {}` with no duration holds until promoted by hand.
    steps:
      - setWeight: 25
      - pause: {duration: 60s}
      - setWeight: 50
      - pause: {duration: 60s}
      - setWeight: 75
      - pause: {duration: 60s}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  # *.localtest.me resolves to 127.0.0.1 publicly, so this works against the
  # kind cluster with nothing in /etc/hosts. Change it for a real cluster.
  host: notes.localtest.me

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
