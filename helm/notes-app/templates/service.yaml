{{- /* Stable Service. Rollouts manages rollouts-pod-template-hash here. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
{{- if .Values.rollout.trafficRouting.enabled }}
---
{{- /* Canary Service. Only needed with traffic routing.
       No `-` on the closing brace: `-}}` would eat the newline after the `---`
       above and render `---apiVersion: v1`, which is not a document separator
       and fails `helm lint` with "invalid Yaml document separator". */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-canary
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
{{- end }}
