{{- /*
Rollout, not Deployment: the Argo Rollouts controller and CRDs must be
installed or Argo CD fails with `no matches for kind "Rollout"`.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "notes-app.fullname" . }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "notes-app.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      {{- if .Values.rollout.trafficRouting.enabled }}
      # Rollouts mutates these Services' selectors to steer traffic -- see
      # ignoreDifferences in argocd/application.yaml.
      stableService: {{ include "notes-app.fullname" . }}
      canaryService: {{ include "notes-app.fullname" . }}-canary
      trafficRouting:
        nginx:
          stableIngress: {{ include "notes-app.fullname" . }}
      {{- end }}
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
  template:
    metadata:
      labels:
        {{- include "notes-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
