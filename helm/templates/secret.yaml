{{- /*
Secret -- same two shapes as configmap.yaml:

  secrets.env    -> flat key/value, injected as environment variables (envFrom)
  secrets.files  -> whole file bodies, mounted at secrets.mountPath, mode 0400

No `enabled` flag: pass data and the Secret is created, leave it empty and nothing
renders. Ships EMPTY, and should usually stay that way --

  ==> A Kubernetes Secret is base64, which is ENCODING, NOT ENCRYPTION. Anything
      you put in values.yaml is committed to git and readable by anyone with repo
      access, forever, including in history. `helm template` prints it too.

      For real credentials, create the Secret outside this chart and reference it:
        extraEnvFrom: [{secretRef: {name: notes-app-db}}]
      with sealed-secrets, External Secrets Operator, or a one-off
        kubectl create secret generic notes-app-db --from-literal=...

      These keys exist so the chart is complete -- use them for non-production
      values only.

workload.yaml carries a `checksum/secret` annotation over this file so an edit
here restarts pods. That hash is BY PATH -- rename this file and update the path
in workload.yaml or restart-on-change silently stops.

Self-contained: the preamble is the same four lines as every other template here.
*/ -}}
{{- $name := .Values.nameOverride | default .Chart.Name -}}
{{- $fullname := .Values.fullnameOverride | default (ternary .Release.Name (printf "%s-%s" .Release.Name $name) (contains $name .Release.Name)) | trunc 63 | trimSuffix "-" -}}
{{- $selector := dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name -}}
{{- $labels := merge (dict "app.kubernetes.io/managed-by" .Release.Service "helm.sh/chart" (printf "%s-%s" .Chart.Name .Chart.Version) "app.kubernetes.io/version" (.Chart.AppVersion | toString)) $selector (.Values.commonLabels | default dict) -}}
{{- $sec := .Values.secrets | default dict -}}
{{- if $sec.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secret
  labels:
    {{- toYaml $labels | nindent 4 }}
type: Opaque
{{- /* `data` with b64enc rather than `stringData`: it keeps values out of
       plain sight in kubectl output and CI logs. It is not a security control --
       `kubectl get secret -o yaml | base64 -d` reverses it in one command. */}}
data:
  {{- range $key, $value := $sec.env }}
  {{ $key }}: {{ $value | toString | b64enc }}
  {{- end }}
{{- end }}
{{- if $sec.files }}
{{- if $sec.env }}
---
{{- /* No `-` on the closing brace above: `-}}` would eat the newline after the
       `---` and render `---apiVersion: v1`, which fails helm lint. */}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secret-files
  labels:
    {{- toYaml $labels | nindent 4 }}
type: Opaque
data:
  {{- range $file, $content := $sec.files }}
  {{- /* tpl first so a file body can reference values, then b64enc. */}}
  {{ $file }}: {{ tpl $content $ | b64enc }}
  {{- end }}
{{- end }}
