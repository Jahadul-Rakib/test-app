{{- /*
ServiceAccount -- created only when serviceAccount.create is true.

Off by default: the pod then uses the namespace's `default` account, which is
right for anything that never calls the Kubernetes API. Turn it on when the app
does call the API, or when it needs a cloud identity (IRSA / Workload Identity)
bound to a dedicated account.

Creating the account grants NO permissions on its own -- a fresh ServiceAccount
can do nothing. Add a Role and RoleBinding through extraManifests in values.yaml.

Self-contained: the preamble is the same four lines as every other template here.
*/ -}}
{{- $name := .Values.nameOverride | default .Chart.Name -}}
{{- $fullname := .Values.fullnameOverride | default (ternary .Release.Name (printf "%s-%s" .Release.Name $name) (contains $name .Release.Name)) | trunc 63 | trimSuffix "-" -}}
{{- $selector := dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name -}}
{{- $labels := merge (dict "app.kubernetes.io/managed-by" .Release.Service "helm.sh/chart" (printf "%s-%s" .Chart.Name .Chart.Version) "app.kubernetes.io/version" (.Chart.AppVersion | toString)) $selector (.Values.commonLabels | default dict) -}}
{{- $sa := .Values.serviceAccount | default dict -}}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name | default $fullname }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- $ann := merge (dict) ($sa.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* Also set on the pod in workload.yaml. Both matter: this one stops the token
       being projected into any pod using the account, the pod-level one is the
       per-pod override. */}}
{{- if hasKey $sa "automount" }}
automountServiceAccountToken: {{ $sa.automount }}
{{- end }}
{{- end }}
